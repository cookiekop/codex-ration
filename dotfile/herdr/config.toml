onboarding = false
[theme]
name = "nord"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+b"

# ---- tmux windows -> Herdr tabs ----
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"

# ---- panes ----
# tmux: Ctrl-b %   split left/right
split_vertical = ["prefix+percent", "prefix+v"]

# tmux: Ctrl-b "   split top/bottom
split_horizontal = ["prefix+double_quote", "prefix+minus"]

# tmux: Ctrl-b z   zoom-pane
zoom = "prefix+z"

# tmux pane navigation, while retaining Herdr's h/j/k/l.
focus_pane_left  = ["prefix+left",  "prefix+h"]
focus_pane_down  = ["prefix+down",  "prefix+j"]
focus_pane_up    = ["prefix+up",    "prefix+k"]
focus_pane_right = ["prefix+right", "prefix+l"]

# ---- session/navigation ----
# tmux: Ctrl-b d   detach-client
detach = "prefix+d"
